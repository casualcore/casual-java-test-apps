group = 'se.laz.casual'
version = '2.0.3'

def gson_version = '2.10.1'
def casual_version = '3.2.35'
def casual_caller_version = '3.2.17'

ext.libs = [
  javaee_api: 'jakarta.platform:jakarta.jakartaee-api:10.0.0',
  casual_api: "se.laz.casual:casual-api:${casual_version}",
  casual_inbound_handler_api: "se.laz.casual:casual-inbound-handler-api:${casual_version}",
  casual_fielded_annotations: "se.laz.casual:casual-fielded-annotations:${casual_version}",
